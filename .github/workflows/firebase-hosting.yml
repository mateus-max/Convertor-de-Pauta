name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Hosting files
        run: |
          test -f index.html || (echo "::error::index.html não existe na raiz do repositório" && exit 1)
          test -f firebase.json || (echo "::error::firebase.json não existe na raiz do repositório" && exit 1)
          echo "Ficheiros do Firebase Hosting encontrados."

      - name: Validate and normalize Firebase service-account secret
        id: credentials
        env:
          FIREBASE_SA_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONVERTOR_DE_PAUTA }}
        run: |
          python - <<'PY'
          import os, json, base64, sys, uuid
          raw = os.environ.get("FIREBASE_SA_SECRET", "").strip().lstrip("\\ufeff")
          if not raw:
              print("::error::O segredo FIREBASE_SERVICE_ACCOUNT_CONVERTOR_DE_PAUTA está vazio ou indisponível para este workflow.")
              sys.exit(1)
          candidates = [raw]
          # Common copy/paste formats: fenced JSON, JSON string, Base64 and Base64URL.
          unfenced = raw
          if unfenced.startswith("```"):
              unfenced = unfenced.replace("```json", "", 1).replace("```JSON", "", 1)
              unfenced = unfenced.replace("```", "").strip()
              candidates.append(unfenced)
          try:
              decoded = base64.b64decode("".join(raw.split()) + "===", validate=False).decode("utf-8-sig").strip()
              candidates.append(decoded)
          except Exception:
              pass
          try:
              decoded_url = base64.urlsafe_b64decode("".join(raw.split()) + "===" ).decode("utf-8-sig").strip()
              candidates.append(decoded_url)
          except Exception:
              pass
          data = None
          normalized = None
          for candidate in candidates:
              try:
                  parsed = json.loads(candidate.lstrip("\\ufeff"))
                  if isinstance(parsed, str):
                      parsed = json.loads(parsed)
                  if isinstance(parsed, dict):
                      data, normalized = parsed, json.dumps(parsed)
                      break
              except Exception:
                  continue
          if data is None:
              print("::error::O segredo existe, mas não é JSON válido nem Base64 de JSON. No GitHub, edite o segredo e cole o conteúdo integral do ficheiro .json descarregado do Firebase, começando por { e terminando em }, sem aspas externas.")
              sys.exit(1)
          required = ("type", "project_id", "private_key", "client_email", "token_uri")
          missing = [key for key in required if not data.get(key)]
          if missing:
              print("::error::A credencial não tem os campos obrigatórios: " + ", ".join(missing))
              sys.exit(1)
          if data["type"] != "service_account":
              print("::error::A credencial não é do tipo service_account.")
              sys.exit(1)
          if data["project_id"] != "convertor-de-pauta":
              print("::error::A chave pertence ao projecto '" + str(data["project_id"]) + "', mas o projecto esperado é 'convertor-de-pauta'.")
              sys.exit(1)
          delimiter = "FIREBASE_JSON_" + uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("json<<" + delimiter + "\n" + normalized + "\n" + delimiter + "\n")
          print("Credencial validada e normalizada. O conteúdo secreto não será apresentado nos logs.")
          PY

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ steps.credentials.outputs.json }}
          projectId: convertor-de-pauta
          channelId: live
          firebaseToolsVersion: 15.4.0
